name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      # The ruff/mypy arguments below mirror .pre-commit-config.yaml so that the
      # local hooks and CI cannot disagree about what "clean" means.
      - name: Run ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy --ignore-missing-imports --no-strict-optional .

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}

      # The dev extra also ships pre-commit, so CI runs it: the pinned hooks add the
      # whitespace/YAML/TOML checks the steps above do not cover, and this catches
      # drift between the pinned hook versions and the current ruff/mypy releases.
      - name: Run pre-commit hooks
        run: python -m pre_commit run --all-files --show-diff-on-failure
